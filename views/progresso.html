{% extends "base.html" %}
{% block title %}Progresso{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><h1>Dashboard de Progresso</h1><a href="{{ url_for('dashboard.dashboard_page') }}" class="btn btn-outline-secondary">Voltar</a></div>
<div class="card"><div class="card-body"><canvas id="grafico" height="120"></canvas></div></div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
fetch("{{ url_for('dashboard.api_progresso') }}").then(r => r.json()).then(data => {
new Chart(document.getElementById("grafico"), {
type:"bar",
data:{labels:["Pendente","Em andamento","Concluída"],datasets:[{label:"Quantidade de tarefas",data:[data["Pendente"],data["Em andamento"],data["Concluída"]]}]},
options:{responsive:true,scales:{y:{beginAtZero:true,ticks:{precision:0}}}}
});
});
</script>
{% endblock %}
