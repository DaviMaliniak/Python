{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body p-4">
<h2 class="mb-4"><i class="bi bi-person-plus"></i> Criar conta</h2>
<form method="POST">
<div class="mb-3"><label class="form-label">Nome</label><input class="form-control" name="nome" required></div>
<div class="mb-3"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Senha</label><input class="form-control" type="password" name="senha" minlength="6" required></div>
<button class="btn btn-success w-100">Cadastrar</button>
</form>
<p class="mt-3 mb-0 text-center"><a href="{{ url_for('auth.login') }}">Voltar para login</a></p>
</div></div></div></div>
{% endblock %}
