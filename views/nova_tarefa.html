{% extends "base.html" %}
{% block title %}Nova tarefa{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body p-4">
<h2>Nova tarefa</h2>
<form method="POST">
<div class="mb-3"><label class="form-label">Título</label><input class="form-control" name="titulo" required></div>
<div class="mb-3"><label class="form-label">Descrição</label><textarea class="form-control" name="descricao" rows="4"></textarea></div>
<div class="mb-3"><label class="form-label">Status</label><select class="form-select" name="status"><option>Pendente</option><option>Em andamento</option><option>Concluída</option></select></div>
<button class="btn btn-primary">Salvar</button>
<a class="btn btn-secondary" href="{{ url_for('dashboard.dashboard_page') }}">Cancelar</a>
</form>
</div></div></div></div>
{% endblock %}
